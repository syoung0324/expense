<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團隊費用統計與管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) for Excel Export & Import -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }
        ::-webkit-scrollbar {
            width: 10px;
            height: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 6px;
            border: 2px solid #f1f5f9;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .sticky-col-1 {
            position: sticky;
            left: 0;
            z-index: 10;
        }
        .sticky-col-2 {
            position: sticky;
            left: 50px;
            z-index: 10;
        }
        .sticky-right {
            position: sticky;
            right: 0;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navigation -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-600 rounded-lg shadow-inner">
                    <i class="fa-solid fa-receipt text-2xl text-amber-300"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-xl font-bold tracking-tight">團隊與球隊費用統計管理系統</h1>
                        <!-- Firestore 雲端同步狀態標籤 -->
                        <div id="syncStatusBadge" class="flex items-center gap-1.5 bg-indigo-800/90 text-emerald-300 text-[11px] px-2.5 py-0.5 rounded-full border border-indigo-500/50 shadow-inner">
                            <i id="syncStatusIcon" class="fa-solid fa-cloud-arrow-up text-xs"></i>
                            <span id="syncStatusText">連線中...</span>
                        </div>
                    </div>
                    <p class="text-xs text-indigo-200">分月支出明細、自選複製項目、Excel多分頁匯入與 Firestore 雲端同步</p>
                </div>
            </div>
           
            <div class="flex flex-wrap items-center gap-2">
                <!-- 管理者登入按鈕 (附帶 🦩 紅鶴圖示) -->
                <button id="btnAdminLogin" onclick="handleAdminBtnClick()" class="bg-indigo-800 hover:bg-indigo-600 text-white font-medium text-xs sm:text-sm px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5 border border-indigo-400/40">
                    <span class="text-base">🦩</span>
                    <span id="adminBtnText">管理者登入</span>
                </button>

                <!-- File Input (Hidden) -->
                <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="hidden" onchange="handleExcelImport(event)">
               
                <!-- 僅管理者登入後顯示：匯入 Excel & 匯出 Excel -->
                <button id="btnImportExcel" onclick="triggerExcelImport()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs sm:text-sm px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-file-import text-base"></i>
                    <span>匯入 Excel</span>
                </button>

                <button id="btnExportExcel" onclick="exportToExcel()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs sm:text-sm px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-file-excel text-base"></i>
                    <span>匯出 Excel</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-5 flex flex-col gap-4">

        <!-- Month Navigation Tabs (僅管理者可拖曳與編輯) -->
        <div class="flex items-center justify-between bg-white p-2 sm:p-3 rounded-xl shadow-sm border border-slate-200 overflow-x-auto gap-2">
            <div class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0" id="monthTabsContainer">
                <!-- Dynamic Month Tabs -->
            </div>
            <!-- 僅管理者登入後顯示：新增月份 -->
            <button id="btnAddMonthBtn" onclick="openAddMonthModal()" class="hidden shrink-0 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium text-xs sm:text-sm px-3 py-1.5 rounded-lg border border-indigo-200 transition flex items-center gap-1">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>新增月份</span>
            </button>
        </div>

        <!-- Control Panel / Management Actions -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <!-- Search Member -->
            <div class="md:col-span-3 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋隊員姓名..." class="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
            </div>

            <!-- Copied Amount Status Chip & Quick Paste -->
            <div class="md:col-span-3 flex items-center justify-center sm:justify-start gap-2">
                <div id="copiedBadge" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs px-3 py-1.5 rounded-lg flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-clipboard-check text-emerald-600"></i>
                    <span>已複製: <strong id="copiedAmountText" class="font-mono font-bold text-emerald-700">0</strong></span>
                    <button onclick="openBatchPasteModal()" class="ml-1 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-medium px-2 py-0.5 rounded shadow transition flex items-center gap-1">
                        <i class="fa-solid fa-paste"></i>
                        <span>批次貼上</span>
                    </button>
                    <button onclick="clearCopiedAmount()" class="text-slate-400 hover:text-rose-500 text-xs" title="清除複製"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <!-- Summary Chips -->
            <div class="md:col-span-3 flex items-center justify-center gap-2 text-xs sm:text-sm">
                <div class="bg-indigo-50 border border-indigo-100 rounded-lg px-2.5 py-1.5 text-indigo-800 flex items-center gap-1.5">
                    <span class="text-slate-500">總人數:</span>
                    <strong id="statMemberCount" class="text-sm sm:text-base font-bold text-indigo-600">0</strong>
                </div>
                <div class="bg-amber-50 border border-amber-100 rounded-lg px-2.5 py-1.5 text-amber-900 flex items-center gap-1.5">
                    <span class="text-slate-500">應收總額:</span>
                    <strong id="statGrandTotal" class="text-sm sm:text-base font-bold text-amber-700">NT$ 0</strong>
                </div>
            </div>

            <!-- View Mode Toggle & Action Buttons -->
            <div class="md:col-span-3 flex flex-wrap items-center justify-end gap-2">
                <div class="bg-slate-100 p-1 rounded-lg flex items-center border border-slate-200">
                    <button id="btnViewTable" onclick="switchViewMode('table')" class="px-2.5 py-1 text-xs font-medium rounded-md bg-white text-indigo-700 shadow-sm transition">表格檢視</button>
                    <button id="btnViewCards" onclick="switchViewMode('cards')" class="px-2.5 py-1 text-xs font-medium rounded-md text-slate-600 hover:text-indigo-600 transition">卡片檢視</button>
                </div>
                <!-- 僅管理者登入後顯示：新增隊員 & 新增項目 -->
                <button id="btnAddMemberBtn" onclick="openAddMemberModal()" class="hidden bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium text-xs sm:text-sm px-2.5 py-1.5 rounded-lg border border-indigo-200 transition flex items-center gap-1">
                    <i class="fa-solid fa-user-plus text-xs"></i>
                    <span>新增隊員</span>
                </button>
                <button id="btnAddColumnBtn" onclick="openAddColumnModal()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs sm:text-sm px-2.5 py-1.5 rounded-lg border border-slate-300 transition flex items-center gap-1">
                    <i class="fa-solid fa-folder-plus text-xs"></i>
                    <span>新增項目</span>
                </button>
            </div>
        </div>

        <!-- Desktop / Scrollable Table View -->
        <div id="tableViewContainer" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
            <div class="overflow-x-auto flex-1 relative max-h-[calc(100vh-310px)] min-h-[400px] border-b border-slate-200 pb-2">
                <table id="expenseTable" class="min-w-max text-left border-collapse text-xs sm:text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 border-b border-slate-200 sticky top-0 z-20 font-semibold select-none" id="tableHeaderRow">
                            <!-- Dynamic Header Generated JS -->
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <!-- Dynamic Rows Generated JS -->
                    </tbody>
                    <tfoot id="tableFooter" class="bg-indigo-50/90 text-indigo-950 font-bold sticky bottom-0 z-20 border-t-2 border-indigo-200">
                        <!-- Dynamic Column Totals Generated JS -->
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- Mobile Card View (Optimized for Small Screens) -->
        <div id="cardsViewContainer" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <!-- Dynamic Member Cards JS -->
        </div>

    </main>

    <!-- Modal: Admin Login (管理者登入視窗) -->
    <div id="adminModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 border border-slate-100">
            <div class="flex items-center gap-2 mb-4 text-indigo-700">
                <span class="text-2xl">🦩</span>
                <h3 class="text-lg font-bold text-slate-800">管理者身分登入</h3>
            </div>
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1" for="adminPasswordInput">管理者密碼</label>
                <input type="password" id="adminPasswordInput" placeholder="請輸入管理者密碼" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" onkeydown="if(event.key==='Enter') checkAdminPassword()">
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeAdminModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs sm:text-sm font-medium">取消</button>
                <button type="button" onclick="checkAdminPassword()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs sm:text-sm font-medium">登入</button>
            </div>
        </div>
    </div>

    <!-- Modal: Add New Month -->
    <div id="monthModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-slate-100 max-h-[85vh] flex flex-col">
            <h3 class="text-lg font-bold text-slate-800 mb-3">新增月份帳目</h3>
            
            <div class="mb-3">
                <label class="block text-xs font-semibold text-slate-600 mb-1" for="monthNameInput">月份名稱</label>
                <input type="text" id="monthNameInput" placeholder="例如: 2026年12月" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <div class="mb-3">
                <label class="inline-flex items-center text-xs text-slate-700 font-semibold cursor-pointer">
                    <input type="checkbox" id="copyRosterCheck" checked class="rounded text-indigo-600 focus:ring-indigo-500 mr-2">
                    <span>自動複製當前月份的隊員名單</span>
                </label>
            </div>

            <!-- 選擇欲複製的費用項目 -->
            <div class="flex-1 overflow-hidden flex flex-col mb-4 bg-slate-50 p-3 rounded-lg border border-slate-200">
                <div class="flex items-center justify-between mb-2 pb-1 border-b border-slate-200">
                    <span class="text-xs font-bold text-slate-700">選擇欲帶入新月份的費用項目：</span>
                    <button type="button" onclick="toggleSelectAllMonthCols()" class="text-xs text-indigo-600 hover:underline font-medium">全選 / 全取消</button>
                </div>
                <div class="flex-1 overflow-y-auto space-y-1.5 pr-1" id="monthColumnCheckboxes">
                    <!-- Dynamic Checkboxes -->
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" onclick="closeMonthModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs sm:text-sm font-medium">取消</button>
                <button type="button" onclick="saveNewMonth()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs sm:text-sm font-medium">建立月份</button>
            </div>
        </div>
    </div>

    <!-- Modal: Edit Month Name (修改月份名稱) -->
    <div id="editMonthModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-3">修改月份名稱</h3>
            <input type="hidden" id="oldMonthNameInput">
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1" for="newMonthNameInput">新月份名稱</label>
                <input type="text" id="newMonthNameInput" placeholder="例如: 2026年12月" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeEditMonthModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs sm:text-sm font-medium">取消</button>
                <button type="button" onclick="saveEditedMonthName()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs sm:text-sm font-medium">儲存修改</button>
            </div>
        </div>
    </div>

    <!-- Modal: Select Excel Sheet (選擇要匯入的 Excel 分頁) -->
    <div id="excelSheetModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-slate-100 flex flex-col max-h-[85vh]">
            <div class="flex items-center gap-2 border-b pb-3 mb-3 text-indigo-700">
                <i class="fa-solid fa-file-excel text-xl text-emerald-600"></i>
                <h3 class="text-lg font-bold text-slate-800">選擇要匯入的工作表 (分頁)</h3>
            </div>
            <p class="text-xs text-slate-500 mb-3">請選擇您欲將資料匯入至「<span id="targetImportMonthLabel" class="font-bold text-indigo-600"></span>」的 Excel 工作表：</p>
            
            <div class="flex-1 overflow-y-auto space-y-2 mb-4 pr-1" id="excelSheetList">
                <!-- Dynamic Radio Options for Sheets -->
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button type="button" onclick="closeExcelSheetModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs sm:text-sm font-medium">取消</button>
                <button type="button" onclick="confirmImportSelectedSheet()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs sm:text-sm font-medium flex items-center gap-1.5">
                    <i class="fa-solid fa-check"></i>
                    <span>確認匯入選取分頁</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Add / Edit Member -->
    <div id="memberModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4" id="memberModalTitle">新增成員</h3>
            <input type="hidden" id="editMemberId">
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1" for="memberNameInput">成員姓名</label>
                <input type="text" id="memberNameInput" placeholder="請輸入姓名" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex justify-between items-center">
                <button type="button" id="btnDeleteMemberInModal" onclick="deleteMemberFromModal()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs sm:text-sm font-medium transition hidden flex items-center gap-1.5">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>刪除此成員</span>
                </button>
                <div class="flex gap-2 ml-auto">
                    <button type="button" onclick="closeMemberModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs sm:text-sm font-medium">取消</button>
                    <button type="button" onclick="saveMember()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs sm:text-sm font-medium">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Add / Edit Column -->
    <div id="columnModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4" id="columnModalTitle">新增費用支出項目 (欄位)</h3>
            <input type="hidden" id="editColumnId">
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1" for="columnTitleInput">費用項目名稱</label>
                <input type="text" id="columnTitleInput" placeholder="例如: 12月隊費、教練費、裝備費" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1" for="columnNoteInput">費用項目備註說明 (選填)</label>
                <textarea id="columnNoteInput" rows="3" placeholder="例如：住宿包含兩晚房費、此項目含隊服與球號訂製..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                <p class="text-[11px] text-slate-400 mt-1">填寫備註後，標題旁邊將會顯示說明圖示，點擊可檢視詳細說明。</p>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeColumnModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs sm:text-sm font-medium">取消</button>
                <button onclick="saveColumn()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs sm:text-sm font-medium">儲存</button>
            </div>
        </div>
    </div>

    <!-- Modal: Mobile Member Fee Edit Modal -->
    <div id="mobileEditModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-5 border border-slate-100 max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between border-b pb-3 mb-3">
                <h3 class="text-base font-bold text-slate-800" id="mobileEditModalName">隊員費用編輯</h3>
                <span id="mobileEditModalTotal" class="text-sm font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-md">應繳: NT$ 0</span>
            </div>
            <div class="flex-1 overflow-y-auto space-y-3 pr-1" id="mobileEditFormBody">
                <!-- Dynamic Fee Inputs -->
            </div>
            <div class="flex justify-end pt-3 mt-2 border-t">
                <button onclick="closeMobileEditModal()" class="w-full sm:w-auto px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs sm:text-sm font-medium">完成並關閉</button>
            </div>
        </div>
    </div>

    <!-- Modal: Column Note View Modal -->
    <div id="noteModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-slate-100">
            <div class="flex items-center gap-2 mb-3 text-indigo-700">
                <i class="fa-solid fa-circle-info text-xl text-amber-500"></i>
                <h3 class="text-lg font-bold text-slate-800" id="noteModalTitle">項目說明</h3>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm text-slate-700 whitespace-pre-line min-h-[80px]" id="noteModalContent">
                <!-- Dynamic Content -->
            </div>
            <div class="flex justify-end mt-4">
                <button onclick="closeNoteModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs sm:text-sm font-medium">關閉</button>
            </div>
        </div>
    </div>

    <!-- Modal: Batch Paste Modal -->
    <div id="batchPasteModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-slate-100 flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between border-b pb-3 mb-3">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">

        function updateSyncStatus(text, iconClass) {

        function initApp() {
            if (localStorage.getItem("team_expense_is_admin") === "true") {
                isAdminLoggedIn = true;

            updateAdminUI();

            const savedMonths = localStorage.getItem("team_expense_months_data");
            const savedCurrentMonth = localStorage.getItem("team_expense_current_month");

            if (savedMonths) {
                try {
                    monthsData = JSON.parse(savedMonths);
                } catch (e) {
                    monthsData = {};
                }
            }

            if (Object.keys(monthsData).length === 0) {

                    members: JSON.parse(JSON.stringify(INITIAL_MEMBERS))

                currentMonth = savedCurrentMonth;

                currentMonth = Object.keys(monthsData)[0];
            }

            loadMonthData(currentMonth, false);
            setupFirestoreListener();
        }

        async function checkAdminPassword() {
            const inputPwd = document.getElementById("adminPasswordInput").value.trim();
            if (!inputPwd) {
                alert("請輸入密碼！");
                return;
            }

            try {
                updateSyncStatus("驗證密碼中...", "fa-solid fa-rotate text-amber-300 animate-spin text-xs");
                let docSnap = await getDoc(adminDocRef);

                if (!docSnap.exists()) {
                    await setDoc(adminDocRef, { password: "88888888" });
                    docSnap = await getDoc(adminDocRef);
                }

                const storedPassword = docSnap.data().password;

                if (inputPwd === storedPassword) {
                    isAdminLoggedIn = true;
                    localStorage.setItem("team_expense_is_admin", "true");
                    updateAdminUI();
                    closeAdminModal();
                    showToast("🦩 管理者登入成功！");
                } else {
                    alert("密碼錯誤，請重新輸入！");
                }
                updateSyncStatus("已即時同步至雲端", "fa-solid fa-cloud-check text-emerald-400 text-xs");
            } catch (e) {
                console.error("Firestore 驗證錯誤:", e);
                alert("連線至雲端資料庫驗證密碼時發生錯誤，請檢查網路連線！");
            }
        }

        function updateAdminUI() {
            const btnText = document.getElementById("adminBtnText");
            const btn = document.getElementById("btnAdminLogin");
            
            const adminOnlyElements = [
                document.getElementById("btnAddMonthBtn"),
                document.getElementById("btnAddMemberBtn"),
                document.getElementById("btnAddColumnBtn"),
                document.getElementById("btnImportExcel"),
                document.getElementById("btnExportExcel")

            if (isAdminLoggedIn) {
                btnText.innerText = "管理者已登入 (登出)";
                btn.className = "bg-emerald-700 hover:bg-emerald-600 text-white font-medium text-xs sm:text-sm px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5 border border-emerald-400/40";

            } else {
                btnText.innerText = "管理者登入";
                btn.className = "bg-indigo-800 hover:bg-indigo-600 text-white font-medium text-xs sm:text-sm px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5 border border-indigo-400/40";
                
                adminOnlyElements.forEach(el => el && el.classList.add("hidden"));
            }

            renderMonthTabs();
            renderTable();
            renderCards();
        }

        function setupFirestoreListener() {
            updateSyncStatus("雲端同步中...", "fa-solid fa-rotate text-amber-300 animate-spin text-xs");

            onSnapshot(dataDocRef, (docSnap) => {
                if (docSnap.metadata.hasPendingWrites) {
                    updateSyncStatus("已即時同步至雲端", "fa-solid fa-cloud-check text-emerald-400 text-xs");
                    return;
                }

                if (docSnap.exists()) {
                    const cloudData = docSnap.data();
                    if (cloudData && cloudData.monthsData) {
                        monthsData = cloudData.monthsData;
                        const savedCurrentMonth = localStorage.getItem("team_expense_current_month");
                        if (savedCurrentMonth && monthsData[savedCurrentMonth]) {
                            currentMonth = savedCurrentMonth;
                        } else if (!monthsData[currentMonth]) {
                            currentMonth = Object.keys(monthsData)[0] || DEFAULT_MONTH_KEY;
                        }
                        loadMonthData(currentMonth, false);
                    }
                    updateSyncStatus("已即時同步至雲端", "fa-solid fa-cloud-check text-emerald-400 text-xs");
                } else {
                    saveState();
                    updateSyncStatus("已即時同步至雲端", "fa-solid fa-cloud-check text-emerald-400 text-xs");
                }
            }, (error) => {
                console.error("Firestore 同步失敗:", error);
                updateSyncStatus("雲端連線失敗 (使用離線快取)", "fa-solid fa-cloud-slash text-rose-400 text-xs");
            });
        }

        function loadMonthData(monthKey, shouldSave = true) {
            currentMonth = monthKey;
            localStorage.setItem("team_expense_current_month", currentMonth);
           
            if (!monthsData[currentMonth]) {
                monthsData[currentMonth] = {
                    columns: JSON.parse(JSON.stringify(columns.length > 0 ? columns : INITIAL_COLUMNS)),
                    members: []
                };
            }

            columns = monthsData[currentMonth].columns;
            members = monthsData[currentMonth].members;

            renderMonthTabs();
            renderTable();
            renderCards();

            if (shouldSave) {
                saveState();
            }
        }

        // 核心寫入 Firestore 方法：移除 merge: true，完全覆寫文件以確保被刪除的月份自雲端徹底刪除
        async function saveState() {
            if (currentMonth && monthsData[currentMonth]) {
                monthsData[currentMonth] = { columns, members };
            }
            localStorage.setItem("team_expense_months_data", JSON.stringify(monthsData));
            localStorage.setItem("team_expense_current_month", currentMonth);

            try {
                updateSyncStatus("儲存中...", "fa-solid fa-rotate text-amber-300 animate-spin text-xs");
                await setDoc(dataDocRef, { 
                    monthsData, 
                    updatedAt: new Date().toISOString() 
                });
                updateSyncStatus("已即時同步至雲端", "fa-solid fa-cloud-check text-emerald-400 text-xs");
            } catch (e) {
                console.error("Save to Firestore Error:", e);
                updateSyncStatus("儲存失敗 (暫存本地)", "fa-solid fa-triangle-exclamation text-amber-400 text-xs");
            }
        }

        // 月份欄位 Drag and Drop 拖曳排序處理（僅管理者權限啟用）
        function handleMonthDragStart(e, mKey) {
            if (!isAdminLoggedIn) return;
            draggedMonthKey = mKey;
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", mKey);
            e.currentTarget.classList.add("opacity-40", "scale-95");
        }

        function handleMonthDragOver(e) {
            if (!isAdminLoggedIn) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
        }

        function handleMonthDragEnter(e) {
            if (!isAdminLoggedIn) return;
            e.preventDefault();
            e.currentTarget.classList.add("border-indigo-500", "ring-2", "ring-indigo-400", "bg-indigo-50");
        }

        function handleMonthDragLeave(e) {
            if (!isAdminLoggedIn) return;
            e.currentTarget.classList.remove("border-indigo-500", "ring-2", "ring-indigo-400", "bg-indigo-50");
        }

        function handleMonthDrop(e, targetKey) {
            if (!isAdminLoggedIn) return;
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.remove("border-indigo-500", "ring-2", "ring-indigo-400", "bg-indigo-50");

            if (!draggedMonthKey || draggedMonthKey === targetKey) return;

            const keys = Object.keys(monthsData);
            const dragIdx = keys.indexOf(draggedMonthKey);
            const targetIdx = keys.indexOf(targetKey);

            if (dragIdx > -1 && targetIdx > -1) {
                keys.splice(dragIdx, 1);
                keys.splice(targetIdx, 0, draggedMonthKey);

                const reorderedMonthsData = {};
                keys.forEach(k => {
                    reorderedMonthsData[k] = monthsData[k];
                });
                monthsData = reorderedMonthsData;

                saveState();
                renderMonthTabs();
                showToast(`已成功重新排序月份標籤！`);
            }
        }

        function handleMonthDragEnd(e) {
            if (!isAdminLoggedIn) return;
            e.currentTarget.classList.remove("opacity-40", "scale-95");
            draggedMonthKey = null;
        }

        function renderMonthTabs() {
            const container = document.getElementById("monthTabsContainer");
            let html = "";
            Object.keys(monthsData).forEach(mKey => {
                const isActive = mKey === currentMonth;
                html += `
                    <div ${isAdminLoggedIn ? `draggable="true" ondragstart="handleMonthDragStart(event, '${mKey}')" ondragover="handleMonthDragOver(event)" ondragenter="handleMonthDragEnter(event)" ondragleave="handleMonthDragLeave(event)" ondrop="handleMonthDrop(event, '${mKey}')" ondragend="handleMonthDragEnd(event)" class="cursor-grab active:cursor-grabbing hover:border-slate-300"` : ''}
                         class="flex items-center group bg-slate-100/80 rounded-lg p-0.5 border border-slate-200/50 transition-all select-none">
                        <button onclick="loadMonthData('${mKey}')" class="px-3 py-1.5 rounded-lg font-medium text-xs sm:text-sm whitespace-nowrap transition flex items-center gap-1.5 ${isActive ? 'bg-indigo-600 text-white shadow-sm font-semibold' : 'text-slate-600 hover:bg-slate-200'}">
                            <i class="fa-regular fa-calendar-check text-xs"></i>
                            <span>${mKey}</span>
                        </button>
                        ${isAdminLoggedIn ? `
                            <button onclick="openEditMonthModal('${mKey}')" class="text-slate-400 hover:text-indigo-600 px-1 transition opacity-70 hover:opacity-100" title="修改月份名稱">
                                <i class="fa-solid fa-pen text-[11px]"></i>
                            </button>
                            ${Object.keys(monthsData).length > 1 ? `
                                <button onclick="deleteMonth('${mKey}')" class="text-slate-400 hover:text-rose-500 pr-1 px-0.5 transition opacity-70 hover:opacity-100" title="刪除此月份">
                                    <i class="fa-solid fa-xmark text-xs"></i>
                                </button>
                            ` : ''}
                        ` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

            if (!isAdminLoggedIn) {

        function saveEditedMonthName() {
            if (!isAdminLoggedIn) return;
            const oldKey = document.getElementById("oldMonthNameInput").value;
            const newKey = document.getElementById("newMonthNameInput").value.trim();

            if (!newKey) {
                alert("請輸入月份名稱！");

            }

            if (newKey !== oldKey && monthsData[newKey]) {
                alert("該月份名稱已存在！");
                return;
            }

            if (newKey !== oldKey) {
                monthsData[newKey] = monthsData[oldKey];
                delete monthsData[oldKey];

                if (currentMonth === oldKey) {
                    currentMonth = newKey;
                }
                saveState();
                renderMonthTabs();
                showToast(`已成功將「${oldKey}」更名為「${newKey}」`);
            }
            closeEditMonthModal();
        }

            if (!isAdminLoggedIn) return;
            document.getElementById("monthNameInput").value = "";
            
            const container = document.getElementById("monthColumnCheckboxes");
            let html = "";
            if (columns.length === 0) {

            document.getElementById("monthNameInput").focus();

        function closeMonthModal() {
            document.getElementById("monthModal").classList.add("hidden");
        }

        function toggleSelectAllMonthCols() {
            const checkboxes = document.querySelectorAll('input[name="copyColumnCheck"]');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
        }

        function saveNewMonth() {
            if (!isAdminLoggedIn) return;
            const monthName = document.getElementById("monthNameInput").value.trim();
            const copyRoster = document.getElementById("copyRosterCheck").checked;

            if (!monthName) {
                alert("請輸入月份名稱！");
                return;
            }
            if (monthsData[monthName]) {
                alert("該月份名稱已存在！");
                return;
            }

            const selectedColIds = Array.from(document.querySelectorAll('input[name="copyColumnCheck"]:checked')).map(el => el.value);
            const copiedColumns = columns.filter(c => selectedColIds.includes(c.id));

            let newMembers = [];
            if (copyRoster && members.length > 0) {
                newMembers = members.map(m => ({
                    id: "m_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
                    name: m.name,
                    values: {}
                }));
            }

            monthsData[monthName] = {
                columns: JSON.parse(JSON.stringify(copiedColumns)),
                members: newMembers
            };

            closeMonthModal();
            loadMonthData(monthName);
            showToast(`已成功新增並切換至「${monthName}」（包含 ${copiedColumns.length} 個費用項目）`);
        }

        function deleteMonth(mKey) {
            if (!isAdminLoggedIn) {
                alert("需有管理者權限才能刪除月份！");
                return;
            }
            if (Object.keys(monthsData).length <= 1) {
                alert("至少需要保留一個月份！");
                return;
            }
            if (confirm(`確定要刪除「${mKey}」整個月份的數據嗎？此動作無法撤銷。`)) {
                delete monthsData[mKey];
                if (currentMonth === mKey) {
                    currentMonth = Object.keys(monthsData)[0];
                }
                saveState();
                loadMonthData(currentMonth, false);
                showToast(`已成功刪除「${mKey}」！`);
            }
        }

            const btnViewCards = document.getElementById("btnViewCards");

            if (mode === 'cards') {

                cardsContainer.classList.remove("hidden");

        function applyBatchPaste() {
            const targetColId = document.getElementById("batchTargetColumnSelect").value;
            if (!targetColId) {
                alert("請選擇目標項目欄位！");
                return;
            }

            const checkboxes = document.querySelectorAll('input[name="batchMemberCheckbox"]:checked');
            if (checkboxes.length === 0) {
                alert("請至少選擇一位隊員！");
                return;
            }

            let count = 0;
            checkboxes.forEach(cb => {
                const memberId = cb.value;
                const member = members.find(m => m.id === memberId);
                if (member) {
                    member.values[targetColId] = copiedAmount;
                    count++;
                }
            });

            saveState();
            renderTable();
            renderCards();
            closeBatchPasteModal();
            showToast(`已成功將 NT$ ${copiedAmount.toLocaleString()} 批次填入 ${count} 位隊員！`);

        function updateMemberValue(memberId, colId, value) {
            const member = members.find(m => m.id === memberId);
            if (member) {
                if (value === "" || isNaN(value)) {
                    delete member.values[colId];
                } else {
                    member.values[colId] = parseFloat(value);
                }
                saveState();
                renderTable();
                renderCards();
            }
        }

        function toggleMemberPaid(memberId, isChecked) {
            const member = members.find(m => m.id === memberId);
            if (member) {
                member.isPaid = isChecked;
                saveState();
                renderTable();
                renderCards();
                showToast(`${member.name} 已標示為 ${isChecked ? '【對帳完成】' : '【未對帳】'}`);

        function saveMember() {
            if (!isAdminLoggedIn) return;
            const nameInput = document.getElementById("memberNameInput").value.trim();
            const editId = document.getElementById("editMemberId").value;
            if (!nameInput) {
                alert("請輸入成員姓名！");
                return;
            }

            if (editId) {
                const member = members.find(m => m.id === editId);
                if (member) {
                    member.name = nameInput;
                    showToast(`已成功修改隊員姓名為: ${nameInput}`);
                }
            } else {
                const newMember = {
                    id: "m_" + Date.now(),
                    name: nameInput,
                    values: {}
                };
                members.push(newMember);
                showToast(`已成功新增隊員: ${nameInput}`);
            }

            saveState();
            renderTable();
            renderCards();
            closeMemberModal();
        }

        function deleteMember(id) {
            if (!isAdminLoggedIn) return;
            const m = members.find(item => item.id === id);
            if (m && confirm(`確定要刪除隊員 "${m.name}" 嗎？刪除後不可恢復。`)) {
                members = members.filter(item => item.id !== id);
                saveState();
                renderTable();
                renderCards();
                showToast(`已刪除隊員 "${m.name}"`);
            }
        }

        function openAddColumnModal() {
            if (!isAdminLoggedIn) return;
            document.getElementById("columnModalTitle").innerText = "新增費用支出項目 (欄位)";
            document.getElementById("editColumnId").value = "";
            document.getElementById("columnTitleInput").value = "";
            document.getElementById("columnNoteInput").value = "";
            document.getElementById("columnModal").classList.remove("hidden");
            document.getElementById("columnTitleInput").focus();
        }

        function openEditColumnModal(colId) {
            if (!isAdminLoggedIn) return;
            const col = columns.find(c => c.id === colId);
            if (!col) return;
            document.getElementById("columnModalTitle").innerText = "修改費用項目名稱與備註";
            document.getElementById("editColumnId").value = colId;
            document.getElementById("columnTitleInput").value = col.title || "";
            document.getElementById("columnNoteInput").value = col.note || "";
            document.getElementById("columnModal").classList.remove("hidden");
            document.getElementById("columnTitleInput").focus();
        }

        function closeColumnModal() {
            document.getElementById("columnModal").classList.add("hidden");
        }

        function saveColumn() {
            if (!isAdminLoggedIn) return;
            const titleInput = document.getElementById("columnTitleInput").value.trim();
            const noteInput = document.getElementById("columnNoteInput").value.trim();
            const editId = document.getElementById("editColumnId").value;
            if (!titleInput) {
                alert("請輸入項目名稱！");
                return;
            }

            if (editId) {
                const col = columns.find(c => c.id === editId);
                if (col) {
                    col.title = titleInput;
                    col.note = noteInput;
                    showToast(`已更新項目: ${titleInput}`);
                }
            } else {
                const newCol = {
                    id: "col_" + Date.now(),
                    title: titleInput,
                    note: noteInput
                };
                columns.push(newCol);
                showToast(`已新增費用欄位: ${titleInput}`);
            }

            saveState();
            renderTable();
            renderCards();
            closeColumnModal();
        }

        function openNoteModal(colId) {
            const col = columns.find(c => c.id === colId);
            if (!col) return;
            document.getElementById("noteModalTitle").innerText = col.title;
            document.getElementById("noteModalContent").innerText = col.note && col.note.trim() !== "" ? col.note : "尚無詳細說明。";
            document.getElementById("noteModal").classList.remove("hidden");
        }

        function closeNoteModal() {
            document.getElementById("noteModal").classList.add("hidden");
        }

        function deleteColumn(colId) {
            if (!isAdminLoggedIn) return;
            const col = columns.find(c => c.id === colId);
            if (col && confirm(`確定要刪除欄位 "${col.title}" 嗎？這將會清空全體成員在該項目的金額。`)) {
                columns = columns.filter(c => c.id !== colId);
                members.forEach(m => {
                    delete m.values[colId];
                });
                saveState();
                renderTable();
                renderCards();
                showToast(`已刪除項目: ${col.title}`);
            }
        }

        function triggerExcelImport() {
            if (!isAdminLoggedIn) return;
            document.getElementById("excelFileInput").click();
        }

        function handleExcelImport(event) {
            if (!isAdminLoggedIn) return;
            const file = event.target.files[0];
            if (!file) return;

            if (typeof XLSX === 'undefined') {
                alert("Excel 解析模組載入失敗，請檢查網路連線。");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    pendingWorkbook = XLSX.read(data, { type: 'array' });
                    
                    if (!pendingWorkbook || !pendingWorkbook.SheetNames || pendingWorkbook.SheetNames.length === 0) {
                        alert("Excel 檔案未包含任何工作表！");
                        return;
                    }

                    renderSheetSelectionModal(pendingWorkbook.SheetNames);
                } catch (err) {
                    console.error(err);
                    alert("讀取 Excel 檔案時發生錯誤，請確定檔案無損壞。");
                } finally {
                    event.target.value = "";
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderSheetSelectionModal(sheetNames) {
            const container = document.getElementById("excelSheetList");
            document.getElementById("targetImportMonthLabel").innerText = currentMonth;

            let html = "";
            sheetNames.forEach((name, idx) => {
                html += `
                    <label class="flex items-center justify-between p-3 bg-slate-50 hover:bg-indigo-50/50 border border-slate-200 rounded-lg cursor-pointer transition">
                        <div class="flex items-center gap-2">
                            <i class="fa-regular fa-file-lines text-indigo-500 text-base"></i>
                            <span class="text-sm font-medium text-slate-800">${name}</span>
                        </div>
                        <input type="radio" name="selectedExcelSheet" value="${name}" ${idx === 0 ? 'checked' : ''} class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                    </label>
                `;
            });
            container.innerHTML = html;
            document.getElementById("excelSheetModal").classList.remove("hidden");
        }

        function closeExcelSheetModal() {
            document.getElementById("excelSheetModal").classList.add("hidden");
            pendingWorkbook = null;
        }

        function confirmImportSelectedSheet() {
            if (!isAdminLoggedIn || !pendingWorkbook) return;

            const radios = document.querySelectorAll('input[name="selectedExcelSheet"]:checked');
            if (radios.length === 0) {
                alert("請選擇一個工作表！");
                return;
            }

            const sheetName = radios[0].value;
            const worksheet = pendingWorkbook.Sheets[sheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            if (!jsonData || jsonData.length < 2) {
                alert(`「${sheetName}」工作表內容為空或格式不正確！`);
                return;
            }

            closeExcelSheetModal();
            processImportData(jsonData, sheetName);
        }

        function processImportData(jsonData, sheetName) {
            if (!isAdminLoggedIn) return;
            const replaceRosterChoice = confirm(`您選擇匯入「${sheetName}」工作表。\n\n請問要如何處理資料？\n\n【確定】: 完全替換「${currentMonth}」的隊員名單與數據（刪除原有舊隊員）\n【取消】: 保留舊隊員，僅合併/更新數據`);

            if (replaceRosterChoice) {
                members = [];
            }

            const headerRow = jsonData[0];
            let nameColIdx = -1;

            headerRow.forEach((colName, index) => {
                if (!colName) return;
                const trimmed = String(colName).trim();
                if (trimmed === "姓名" || trimmed === "成員姓名" || trimmed === "Name") {
                    nameColIdx = index;
                }
            });

            if (nameColIdx === -1) {
                nameColIdx = 0;
            }

            const excelColMapping = {};
            let addedColCount = 0;

            headerRow.forEach((colName, index) => {
                if (index === nameColIdx || !colName) return;
                const trimmed = String(colName).trim();
                if (trimmed === "應繳金額" || trimmed === "合計" || trimmed === "總計" || trimmed === "#" || trimmed === "序號" || trimmed.includes("對帳")) {
                    return;
                }

                let existingCol = columns.find(c => c.title.trim().toLowerCase() === trimmed.toLowerCase());
                if (!existingCol) {
                    existingCol = {
                        id: "col_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
                        title: trimmed,
                        note: ""
                    };
                    columns.push(existingCol);
                    addedColCount++;
                }
                excelColMapping[index] = existingCol.id;
            });

            let updatedMemberCount = 0;
            let addedMemberCount = 0;

            for (let r = 1; r < jsonData.length; r++) {
                const row = jsonData[r];
                if (!row || row.length === 0) continue;

                const rawName = row[nameColIdx];
                if (!rawName) continue;
                const memberName = String(rawName).trim();

                if (memberName === "合計" || memberName === "總計" || memberName === "Total") continue;

                let targetMember = members.find(m => m.name.trim().toLowerCase() === memberName.toLowerCase());
                if (!targetMember) {
                    targetMember = {
                        id: "m_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
                        name: memberName,
                        values: {}
                    };
                    members.push(targetMember);
                    addedMemberCount++;
                } else {
                    updatedMemberCount++;
                }

                Object.keys(excelColMapping).forEach(cIdx => {
                    const colId = excelColMapping[cIdx];
                    const cellValue = row[cIdx];
                    const val = parseFloat(cellValue);
                   
                    if (cellValue !== undefined && cellValue !== null && cellValue !== "" && !isNaN(val)) {
                        targetMember.values[colId] = val;
                    }
                });
            }

            saveState();
            renderTable();
            renderCards();
            showToast(`已成功從「${sheetName}」分頁匯入資料！（新增 ${addedMemberCount} 位隊員，共 ${members.length} 人）`);
        }

        function exportToExcel() {
            if (!isAdminLoggedIn) return;
            if (typeof XLSX === 'undefined') {
                alert("Excel 匯出模組載入失敗，請檢查網路連線。");
                return;
            }

            const headers = ["姓名", ...columns.map(c => c.title), "【姜宸媽追殺區】對帳", "應繳金額"];
            const data = [headers];

            let grandTotal = 0;
            const columnTotals = {};
            columns.forEach(c => columnTotals[c.id] = 0);
            let totalPaidCount = 0;

            members.forEach(member => {
                let memberTotal = 0;
                const row = [member.name];

                columns.forEach(col => {
                    const val = member.values[col.id] !== undefined ? parseFloat(member.values[col.id]) : 0;
                    row.push(val !== 0 ? val : "");
                    memberTotal += val;
                    columnTotals[col.id] += val;
                });

                if (member.isPaid) totalPaidCount++;
                row.push(member.isPaid ? "已對帳" : "未對帳");
                row.push(memberTotal);
                grandTotal += memberTotal;
                data.push(row);
            });

            const totalRow = ["合計"];
            columns.forEach(col => {
                totalRow.push(columnTotals[col.id] || 0);
            });
            totalRow.push(`完成: ${totalPaidCount}/${members.length}`);
            totalRow.push(grandTotal);
            data.push(totalRow);

            const worksheet = XLSX.utils.aoa_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, `${currentMonth}_費用統計`);

            const colWidths = headers.map(h => ({ wch: Math.max(h.length * 3, 12) }));
            worksheet['!cols'] = colWidths;

            XLSX.writeFile(workbook, `團隊費用統計表_${currentMonth}.xlsx`);
            showToast("Excel 統計表匯出成功！");
        }

        function handleSearch() {
            searchQuery = document.getElementById("searchInput").value;
            renderTable();
            renderCards();
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            const toastText = document.getElementById("toastText");
            toastText.innerText = message;
            toast.classList.remove("opacity-0", "pointer-events-none");
            toast.classList.add("opacity-100");

            setTimeout(() => {
                toast.classList.remove("opacity-100");
                toast.classList.add("opacity-0", "pointer-events-none");
            }, 2500);
        }

        // 全域 window 事件匯出
        Object.assign(window, {
            handleAdminBtnClick,
            openAdminModal,
            closeAdminModal,
            checkAdminPassword,
            handleMonthDragStart,
            handleMonthDragOver,
            handleMonthDragEnter,
            handleMonthDragLeave,
            handleMonthDrop,
            handleMonthDragEnd,
            loadMonthData,
            openAddMonthModal,
            closeMonthModal,
            toggleSelectAllMonthCols,
            saveNewMonth,
            openEditMonthModal,
            closeEditMonthModal,
            saveEditedMonthName,
            deleteMonth,
            switchViewMode,
            copyAmount,
            clearCopiedAmount,
            openBatchPasteModal,
            closeBatchPasteModal,
            toggleSelectAllBatchMembers,
            applyBatchPaste,
            renderTable,
            renderCards,
            updateMemberValue,
            toggleMemberPaid,
            openMobileEditModal,
            updateMobileModalTotal,
            closeMobileEditModal,
            openAddMemberModal,
            openEditMemberModal,
            closeMemberModal,
            deleteMemberFromModal,
            saveMember,
            deleteMember,
            openAddColumnModal,
            openEditColumnModal,
            closeColumnModal,
            saveColumn,
            openNoteModal,
            closeNoteModal,
            deleteColumn,
            triggerExcelImport,
            handleExcelImport,
            closeExcelSheetModal,
            confirmImportSelectedSheet,
            exportToExcel,
            handleSearch,
            showToast
        });

        window.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
