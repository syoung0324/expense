<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團隊費用統計與管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }
        /* Custom Scrollbar for visual comfort */
        ::-webkit-scrollbar {
            width: 10px;
            height: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 6px;
            border: 2px solid #f1f5f9;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Sticky Column Styling */
        .sticky-col-1 {
            position: sticky;
            left: 0;
            z-index: 10;
        }
        .sticky-col-2 {
            position: sticky;
            left: 50px;
            z-index: 10;
        }
        .sticky-right {
            position: sticky;
            right: 0;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navigation -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-600 rounded-lg shadow-inner">
                    <i class="fa-solid fa-receipt text-2xl text-amber-300"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">團隊與球隊費用統計管理系統</h1>
                    <p class="text-xs text-indigo-200">月度支出明細、自動算總額與 Excel 導出</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <button id="btnExportExcel" onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-file-excel text-lg"></i>
                    <span>匯出 Excel 統計表</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

        <!-- Control Panel / Management Actions -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <!-- Search Member -->
            <div class="md:col-span-4 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋隊員姓名..." class="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
            </div>

            <!-- Summary Chips -->
            <div class="md:col-span-4 flex items-center justify-center gap-4 text-xs sm:text-sm">
                <div class="bg-indigo-50 border border-indigo-100 rounded-lg px-3 py-1.5 text-indigo-800 flex items-center gap-2">
                    <span class="text-slate-500">總人數:</span>
                    <strong id="statMemberCount" class="text-base font-bold text-indigo-600">0</strong> 人
                </div>
                <div class="bg-amber-50 border border-amber-100 rounded-lg px-3 py-1.5 text-amber-900 flex items-center gap-2">
                    <span class="text-slate-500">應收總額:</span>
                    <strong id="statGrandTotal" class="text-base font-bold text-amber-700">NT$ 0</strong>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="md:col-span-4 flex justify-end gap-2">
                <button onclick="openAddMemberModal()" class="flex-1 sm:flex-initial bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium text-xs sm:text-sm px-3 py-2 rounded-lg border border-indigo-200 transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>新增成員</span>
                </button>
                <button onclick="openAddColumnModal()" class="flex-1 sm:flex-initial bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs sm:text-sm px-3 py-2 rounded-lg border border-slate-300 transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-folder-plus"></i>
                    <span>新增費用項目</span>
                </button>
            </div>
        </div>

        <!-- Table Card -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
            <!-- Scrollable Table Wrap -->
            <div class="overflow-x-auto flex-1 relative max-h-[calc(100vh-280px)] min-h-[400px] border-b border-slate-200 pb-2">
                <table id="expenseTable" class="min-w-max text-left border-collapse text-xs sm:text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 border-b border-slate-200 sticky top-0 z-20 font-semibold select-none" id="tableHeaderRow">
                            <!-- Dynamic Header Generated JS -->
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <!-- Dynamic Rows Generated JS -->
                    </tbody>
                    <tfoot id="tableFooter" class="bg-indigo-50/90 text-indigo-950 font-bold sticky bottom-0 z-20 border-t-2 border-indigo-200">
                        <!-- Dynamic Column Totals Generated JS -->
                    </tfoot>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal: Add / Edit Member -->
    <div id="memberModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4" id="memberModalTitle">新增成員</h3>
            <input type="hidden" id="editMemberId">
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1" for="memberNameInput">成員姓名</label>
                <input type="text" id="memberNameInput" placeholder="請輸入姓名" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex justify-between items-center">
                <button type="button" id="btnDeleteMemberInModal" onclick="deleteMemberFromModal()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs sm:text-sm font-medium transition hidden flex items-center gap-1.5">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>刪除此成員</span>
                </button>
                <div class="flex gap-2 ml-auto">
                    <button type="button" onclick="closeMemberModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs sm:text-sm font-medium">取消</button>
                    <button type="button" onclick="saveMember()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs sm:text-sm font-medium">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Add / Edit Column -->
    <div id="columnModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4" id="columnModalTitle">新增費用支出項目 (欄位)</h3>
            <input type="hidden" id="editColumnId">
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1" for="columnTitleInput">費用項目名稱</label>
                <input type="text" id="columnTitleInput" placeholder="例如: 12月隊費、教練費、裝備費" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1" for="columnNoteInput">費用項目備註說明 (選填)</label>
                <textarea id="columnNoteInput" rows="3" placeholder="例如：住宿包含兩晚房費、此項目含隊服與球號訂製..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                <p class="text-[11px] text-slate-400 mt-1">填寫備註後，標題旁邊將會顯示說明圖示，點擊可檢視詳細說明。</p>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeColumnModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs sm:text-sm font-medium">取消</button>
                <button onclick="saveColumn()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs sm:text-sm font-medium">儲存</button>
            </div>
        </div>
    </div>

    <!-- Modal: Column Note View Modal -->
    <div id="noteModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-slate-100">
            <div class="flex items-center gap-2 mb-3 text-indigo-700">
                <i class="fa-solid fa-circle-info text-xl text-amber-500"></i>
                <h3 class="text-lg font-bold text-slate-800" id="noteModalTitle">項目說明</h3>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm text-slate-700 whitespace-pre-line min-h-[80px]" id="noteModalContent">
                <!-- Dynamic Content -->
            </div>
            <div class="flex justify-end mt-4">
                <button onclick="closeNoteModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs sm:text-sm font-medium">關閉</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Message -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white text-xs sm:text-sm px-4 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toastText">操作成功</span>
    </div>

            { id: "m_43", name: "林邑達", values: { col_1: 2500, col_2: 500, col_3: 90, col_6: 370, col_7: 1144, col_8: 2088 } },
            { id: "m_44", name: "劉宜菲", values: { col_1: 2500, col_2: 500, col_3: 90, col_6: 370, col_7: 1473, col_8: 614, col_10: 1200 } }
        ];

        // App State
        let columns = [];
        let members = [];
        let searchQuery = "";

        // Load Application State
        function initApp() {
            const savedCols = localStorage.getItem("team_expense_cols");
            const savedMembers = localStorage.getItem("team_expense_members");

            if (savedCols && savedMembers) {
                columns = JSON.parse(savedCols);
                members = JSON.parse(savedMembers);
            } else {
                columns = JSON.parse(JSON.stringify(INITIAL_COLUMNS));
                members = JSON.parse(JSON.stringify(INITIAL_MEMBERS));
                saveState();
            }
            renderTable();
        }

        // Save State to LocalStorage
        function saveState() {
            localStorage.setItem("team_expense_cols", JSON.stringify(columns));
            localStorage.setItem("team_expense_members", JSON.stringify(members));
        }

        // Reset to default data
        function resetToDefaultData() {
            if (confirm("確定要重置所有數據回照片範例值嗎？您的自訂變更將會被覆蓋。")) {
                columns = JSON.parse(JSON.stringify(INITIAL_COLUMNS));
                members = JSON.parse(JSON.stringify(INITIAL_MEMBERS));
                saveState();
                renderTable();
                showToast("已成功重置為範例數據！");
            }
        }

        // Render Table Headers, Rows, and Footer
        function renderTable() {
            const headerRow = document.getElementById("tableHeaderRow");
            const tbody = document.getElementById("tableBody");
            const tfoot = document.getElementById("tableFooter");

            // Filter members based on search
            const filteredMembers = members.filter(m => m.name.toLowerCase().includes(searchQuery.toLowerCase()));

            // Render Header
            let headerHTML = `
                <th class="p-3 w-12 text-center sticky-col-1 bg-slate-100 border-r border-slate-200">#</th>
                <th class="p-3 w-36 sticky-col-2 bg-slate-100 border-r border-slate-200 shadow-sm">姓名</th>
            `;
            columns.forEach(col => {
                const hasNote = col.note && col.note.trim() !== "";
                headerHTML += `
                    <th class="py-2.5 px-2 text-center whitespace-nowrap border-r border-slate-200 group relative">
                        <div class="flex items-center justify-center gap-1">
                            <div class="flex items-center gap-1 truncate cursor-pointer" onclick="${hasNote ? `openNoteModal('${col.id}')` : `openEditColumnModal('${col.id}')`}" title="${hasNote ? '點擊查看項目說明' : '點擊編輯項目'}">
                                <span class="truncate font-semibold text-slate-800 hover:text-indigo-600 transition">${col.title}</span>
                                ${hasNote ? `<button onclick="event.stopPropagation(); openNoteModal('${col.id}')" class="text-amber-500 hover:text-amber-600 text-xs" title="查看備註說明"><i class="fa-solid fa-circle-info"></i></button>` : ''}
                            </div>
                            <div class="flex items-center opacity-0 group-hover:opacity-100 transition">
                                <button onclick="openEditColumnModal('${col.id}')" class="text-slate-400 hover:text-indigo-600 px-0.5" title="編輯項目標題與備註">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="deleteColumn('${col.id}')" class="text-slate-400 hover:text-rose-500 px-0.5" title="刪除此項目欄位">
                                    <i class="fa-solid fa-xmark text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </th>
                `;
            });
            headerHTML += `
                <th class="py-2.5 px-3 w-28 text-right sticky-right bg-slate-100 border-l border-slate-200 text-indigo-700 font-bold shadow-sm whitespace-nowrap">應繳金額</th>
                <th class="py-2.5 px-2 w-12 text-center whitespace-nowrap">操作</th>
            `;
            headerRow.innerHTML = headerHTML;

            // Render Body Rows
            let bodyHTML = "";
            let grandTotalSum = 0;
            const columnTotals = {};
            columns.forEach(c => columnTotals[c.id] = 0);

            filteredMembers.forEach((member, index) => {
                let memberTotal = 0;

                let rowHTML = `
                    <tr class="hover:bg-slate-50/80 transition group">
                        <td class="py-2 px-2 text-center text-slate-400 sticky-col-1 bg-white group-hover:bg-slate-50 border-r border-slate-200 font-mono text-xs">${index + 1}</td>
                        <td class="py-2 px-3 font-medium text-slate-800 sticky-col-2 bg-white group-hover:bg-slate-50 border-r border-slate-200 shadow-sm whitespace-nowrap">
                            <div class="flex items-center justify-between gap-1">
                                <span class="truncate cursor-pointer hover:text-indigo-600 transition" onclick="openEditMemberModal('${member.id}')" title="點擊修改姓名">${member.name}</span>
                                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                                    <button onclick="openEditMemberModal('${member.id}')" class="text-slate-400 hover:text-indigo-600 px-0.5" title="編輯姓名">
                                        <i class="fa-solid fa-pen text-xs"></i>
                                    </button>
                                    <button onclick="deleteMember('${member.id}')" class="text-slate-400 hover:text-rose-500 px-0.5" title="直接刪除此成員">
                                        <i class="fa-solid fa-user-minus text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </td>
                `;

                columns.forEach(col => {
                    const val = member.values[col.id] !== undefined ? member.values[col.id] : "";
                    const numVal = parseFloat(val) || 0;
                    memberTotal += numVal;
                    columnTotals[col.id] += numVal;

                    rowHTML += `
                        <td class="py-1 px-1 border-r border-slate-100 text-center">
                            <input type="number" 
                                value="${val}" 
                                placeholder="0"
                                onchange="updateMemberValue('${member.id}', '${col.id}', this.value)"
                                class="w-20 px-1 py-0.5 text-right bg-transparent focus:bg-white focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 rounded border border-transparent hover:border-slate-200 font-mono text-xs sm:text-sm ${numVal < 0 ? 'text-rose-600 font-semibold' : 'text-slate-700'}">
                        </td>
                    `;
                });

                grandTotalSum += memberTotal;

                rowHTML += `
                        <td class="py-2 px-3 text-right font-bold text-indigo-700 sticky-right bg-white group-hover:bg-slate-50 border-l border-slate-200 font-mono shadow-sm whitespace-nowrap">
                            ${memberTotal.toLocaleString()}
                        </td>
                        <td class="py-2 px-1 text-center">
                            <button onclick="deleteMember('${member.id}')" class="text-slate-300 hover:text-rose-500 transition px-1 py-0.5" title="刪除隊員">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </td>
                    </tr>
                `;
                bodyHTML += rowHTML;
            });

            if (filteredMembers.length === 0) {
                bodyHTML = `
                    <tr>
                        <td colspan="${columns.length + 4}" class="p-8 text-center text-slate-400">
                            沒有找到相關的隊員資料
                        </td>
                    </tr>
                `;
            }

            tbody.innerHTML = bodyHTML;

            // Render Footer Totals
            let footerHTML = `
                <tr>
                    <td class="p-3 sticky-col-1 bg-indigo-50 border-r border-indigo-200"></td>
                    <td class="p-3 sticky-col-2 bg-indigo-50 border-r border-indigo-200 font-bold text-indigo-900 shadow-sm">合計 (總數)</td>
            `;

            columns.forEach(col => {
                const colSum = columnTotals[col.id] || 0;
                footerHTML += `
                    <td class="p-3 text-right border-r border-indigo-100 font-mono ${colSum < 0 ? 'text-rose-600' : ''}">
                        ${colSum.toLocaleString()}
                    </td>
                `;
            });

            footerHTML += `
                    <td class="p-3 text-right sticky-right bg-indigo-50 border-l border-indigo-200 text-indigo-950 font-extrabold text-base font-mono shadow-sm">
                        ${grandTotalSum.toLocaleString()}
                    </td>
                    <td class="p-3"></td>
                </tr>
            `;
            tfoot.innerHTML = footerHTML;

            // Update Header Stats
            document.getElementById("statMemberCount").innerText = members.length;
            document.getElementById("statGrandTotal").innerText = `NT$ ${grandTotalSum.toLocaleString()}`;
        }

        // Handle Real-time Value Updates
        function updateMemberValue(memberId, colId, value) {
            const member = members.find(m => m.id === memberId);
            if (member) {
                if (value === "" || isNaN(value)) {
                    delete member.values[colId];
                } else {
                    member.values[colId] = parseFloat(value);
                }
                saveState();
                renderTable();
            }
        }

        // Search Filter
        function handleSearch() {
            searchQuery = document.getElementById("searchInput").value;
            renderTable();
        }

        // Add / Edit Member Modal Handling
        function openAddMemberModal() {
            document.getElementById("memberModalTitle").innerText = "新增成員";
            document.getElementById("editMemberId").value = "";
            document.getElementById("memberNameInput").value = "";
            document.getElementById("btnDeleteMemberInModal").classList.add("hidden");
            document.getElementById("memberModal").classList.remove("hidden");
            document.getElementById("memberNameInput").focus();
        }

        function openEditMemberModal(id) {
            const m = members.find(item => item.id === id);
            if (!m) return;
            document.getElementById("memberModalTitle").innerText = "修改隊員姓名";
            document.getElementById("editMemberId").value = id;
            document.getElementById("memberNameInput").value = m.name;
            document.getElementById("btnDeleteMemberInModal").classList.remove("hidden");
            document.getElementById("memberModal").classList.remove("hidden");
            document.getElementById("memberNameInput").focus();
        }

        function closeMemberModal() {
            document.getElementById("memberModal").classList.add("hidden");
        }

        function deleteMemberFromModal() {
            const editId = document.getElementById("editMemberId").value;
            if (editId) {
                deleteMember(editId);
                closeMemberModal();
            }
        }

        function saveMember() {
            const nameInput = document.getElementById("memberNameInput").value.trim();
            const editId = document.getElementById("editMemberId").value;
            if (!nameInput) {
                alert("請輸入成員姓名！");
                return;
            }

            if (editId) {
                // Edit existing member
                const member = members.find(m => m.id === editId);
                if (member) {
                    member.name = nameInput;
                    showToast(`已成功修改隊員姓名為: ${nameInput}`);
                }
            } else {
                // Add new member
                const newMember = {
                    id: "m_" + Date.now(),
                    name: nameInput,
                    values: {}
                };
                members.push(newMember);
                showToast(`已成功新增隊員: ${nameInput}`);
            }

            saveState();
            renderTable();
            closeMemberModal();
        }

        function deleteMember(id) {
            const m = members.find(item => item.id === id);
            if (m && confirm(`確定要刪除隊員 "${m.name}" 嗎？刪除後不可恢復。`)) {
                members = members.filter(item => item.id !== id);
                saveState();
                renderTable();
                showToast(`已刪除隊員 "${m.name}"`);
            }
        }

        // Add / Edit Column Modal Handling
        function openAddColumnModal() {
            document.getElementById("columnModalTitle").innerText = "新增費用支出項目 (欄位)";
            document.getElementById("editColumnId").value = "";
            document.getElementById("columnTitleInput").value = "";
            document.getElementById("columnNoteInput").value = "";
            document.getElementById("columnModal").classList.remove("hidden");
            document.getElementById("columnTitleInput").focus();
        }

        function openEditColumnModal(colId) {
            const col = columns.find(c => c.id === colId);
            if (!col) return;
            document.getElementById("columnModalTitle").innerText = "修改費用項目名稱與備註";
            document.getElementById("editColumnId").value = colId;
            document.getElementById("columnTitleInput").value = col.title || "";
            document.getElementById("columnNoteInput").value = col.note || "";
            document.getElementById("columnModal").classList.remove("hidden");
            document.getElementById("columnTitleInput").focus();
        }

        function closeColumnModal() {
            document.getElementById("columnModal").classList.add("hidden");
        }

        function saveColumn() {
            const titleInput = document.getElementById("columnTitleInput").value.trim();
            const noteInput = document.getElementById("columnNoteInput").value.trim();
            const editId = document.getElementById("editColumnId").value;
            if (!titleInput) {
                alert("請輸入項目名稱！");
                return;
            }

            if (editId) {
                // Edit existing column title and note
                const col = columns.find(c => c.id === editId);
                if (col) {
                    col.title = titleInput;
                    col.note = noteInput;
                    showToast(`已更新項目: ${titleInput}`);
                }
            } else {
                // Add new column
                const newCol = {
                    id: "col_" + Date.now(),
                    title: titleInput,
                    note: noteInput
                };
                columns.push(newCol);
                showToast(`已新增費用欄位: ${titleInput}`);
            }

            saveState();
            renderTable();
            closeColumnModal();
        }

        // Note View Modal Functions
        function openNoteModal(colId) {
            const col = columns.find(c => c.id === colId);
            if (!col) return;
            document.getElementById("noteModalTitle").innerText = col.title;
            document.getElementById("noteModalContent").innerText = col.note && col.note.trim() !== "" ? col.note : "尚無詳細說明。";
            document.getElementById("noteModal").classList.remove("hidden");
        }

        function closeNoteModal() {
            document.getElementById("noteModal").classList.add("hidden");
        }

        function deleteColumn(colId) {
            const col = columns.find(c => c.id === colId);
            if (col && confirm(`確定要刪除欄位 "${col.title}" 嗎？這將會清空全體成員在該項目的金額。`)) {
                columns = columns.filter(c => c.id !== colId);
                members.forEach(m => {
                    delete m.values[colId];
                });
                saveState();
                renderTable();
                showToast(`已刪除項目: ${col.title}`);
            }
        }

        // Export Table to Excel (.xlsx) using SheetJS
        function exportToExcel() {
            if (typeof XLSX === 'undefined') {
                alert("Excel 匯出模組載入失敗，請檢查網路連線。");
                return;
            }

            // Create Worksheet Headers
            const headers = ["姓名", ...columns.map(c => c.title), "應繳金額"];
            const data = [headers];

            // Member Rows
            let grandTotal = 0;
            const columnTotals = {};
            columns.forEach(c => columnTotals[c.id] = 0);

            members.forEach(member => {
                let memberTotal = 0;
                const row = [member.name];

                columns.forEach(col => {
                    const val = member.values[col.id] !== undefined ? parseFloat(member.values[col.id]) : 0;
                    row.push(val !== 0 ? val : "");
                    memberTotal += val;
                    columnTotals[col.id] += val;
                });

                row.push(memberTotal);
                grandTotal += memberTotal;
                data.push(row);
            });

            // Summary Total Row
            const totalRow = ["合計"];
            columns.forEach(col => {
                totalRow.push(columnTotals[col.id] || 0);
            });
            totalRow.push(grandTotal);
            data.push(totalRow);

            // Generate Sheet and Workbook
            const worksheet = XLSX.utils.aoa_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "費用明細統計");

            // Format Column Widths automatically
            const colWidths = headers.map(h => ({ wch: Math.max(h.length * 3, 12) }));
            worksheet['!cols'] = colWidths;

            // Save File
            const now = new Date();
            const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
            XLSX.writeFile(workbook, `團隊費用統計表_${dateStr}.xlsx`);
            showToast("Excel 統計表匯出成功！");
        }

        // Toast Helper
        function showToast(message) {
            const toast = document.getElementById("toast");
            const toastText = document.getElementById("toastText");
            toastText.innerText = message;
            toast.classList.remove("opacity-0", "pointer-events-none");
            toast.classList.add("opacity-100");

            setTimeout(() => {
                toast.classList.remove("opacity-100");
                toast.classList.add("opacity-0", "pointer-events-none");
            }, 2500);
        }

        // Initialize App on DOM Load
        window.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
</html>
